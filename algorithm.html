<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Algorithm Docs</title>

  <!-- Tailwind (spacing only) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Highlight.js & Marked -->
  <link id="hljsStyle" rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-light.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/highlight.js"></script>

  <!-- Monaco Editor -->
  <script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>

  <link rel="stylesheet" href="algorithm-style.css">

  <style>
    .practice-drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 50%;
      height: 100%;
      background: var(--bg-color);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease;
      z-index: 1000;
    }

    .practice-drawer.open {
      right: 0;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="top-bar sticky top-0 p-4 flex items-center gap-4">
    <a href="index.html" class="back-btn font-medium">⬅ Back</a>
    <h1 class="text-xl font-semibold">📘 Algorithm Notes</h1>

    <button id="practiceToggle" class="primary-btn ml-auto">
      💻 Practice
    </button>

    <button id="themeToggle" class="primary-btn">
      🌙 Dark Mode
    </button>
  </header>

  <!-- Main Content -->
  <div style="height:85vh;">
    <div id="content"
      class="markdown-body"
      style="height:100%; overflow-y:auto; padding:2rem;">
    </div>
  </div>

  <!-- Practice Drawer -->
  <div id="practiceDrawer" class="practice-drawer">

    <div style="
      padding:1rem;
      border-bottom:1px solid var(--border-color);
      background:var(--top-bg);
      color:var(--top-text);
      display:flex;
      justify-content:space-between;
      align-items:center;
    ">
      <h2 style="font-weight:600;">💻 Practice Mode</h2>
      <div style="display:flex; gap:1rem;">
        <button onclick="generatePrompt()" class="primary-btn">
          🧠 Copy AI Review Prompt
        </button>
        <button onclick="closePractice()" class="primary-btn">
          ❌ Close
        </button>
      </div>
    </div>

    <div id="editor" style="flex:1;"></div>
  </div>

  <!-- Template Drawer -->
  <div id="codeDrawer" class="code-drawer">
    <h2 id="codeTitle" class="font-semibold mb-2">Official Reference Code</h2>
    <pre><code id="codeBlock" class="language-java"></code></pre>
  </div>

  <div id="drawerToggle" class="drawer-toggle">
    📘 Template
  </div>

  <script>
    let currentTemplateCode = '';
    let algorithmName = '';

    const themeBtn = document.getElementById("themeToggle");
    const htmlEl = document.documentElement;

    function setTheme(theme) {
      if (theme === "dark") {
        htmlEl.classList.add("dark");
        themeBtn.textContent = "☀️ Light Mode";
        document.getElementById("hljsStyle").href =
          "https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css";
        if (window.monaco) monaco.editor.setTheme("vs-dark");
      } else {
        htmlEl.classList.remove("dark");
        themeBtn.textContent = "🌙 Dark Mode";
        document.getElementById("hljsStyle").href =
          "https://cdn.jsdelivr.net/npm/highlight.js/styles/github-light.min.css";
        if (window.monaco) monaco.editor.setTheme("vs");
      }
      localStorage.setItem("theme", theme);
    }

    themeBtn.addEventListener("click", () => {
      const newTheme = htmlEl.classList.contains("dark") ? "light" : "dark";
      setTheme(newTheme);
    });

    document.getElementById("practiceToggle")
      .addEventListener("click", () => {
        document.getElementById("practiceDrawer")
          .classList.toggle("open");
      });

    function closePractice() {
      document.getElementById("practiceDrawer")
        .classList.remove("open");
    }

    document.addEventListener("DOMContentLoaded", () => {

      const saved =
        localStorage.getItem("theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light");

      const params = new URLSearchParams(window.location.search);
      const path = params.get("path");

      if (path) {
        algorithmName = path.replace(".md", "");

        fetch(`https://raw.githubusercontent.com/IamSamyak/Algorithms/main/${path}`)
          .then(r => r.text())
          .then(md => {
            document.getElementById("content").innerHTML = marked.parse(md);
            hljs.highlightAll();
          });

        fetch(`https://raw.githubusercontent.com/IamSamyak/Algorithms/main/${algorithmName}.java`)
          .then(r => r.text())
          .then(code => {
            currentTemplateCode = code;
            document.getElementById("codeBlock").textContent = code;
            hljs.highlightAll();
          });
      }

      require.config({ paths: { vs: 'https://unpkg.com/monaco-editor@0.45.0/min/vs' } });

      require(['vs/editor/editor.main'], function () {

        window.editor = monaco.editor.create(
          document.getElementById('editor'),
          {
            value: `// Write your ${algorithmName} implementation here\n\npublic class Solution {\n\n}`,
            language: 'java',
            theme: saved === "dark" ? "vs-dark" : "vs",
            automaticLayout: true,
            fontSize: 14,
            minimap: { enabled: false }
          }
        );

        setTheme(saved);
      });
    });

    document.getElementById("drawerToggle")
      .addEventListener("click", () => {
        document.getElementById("codeDrawer")
          .classList.toggle("open");
      });

    function generatePrompt() {
      const userCode = window.editor.getValue();

      const prompt = `
You are a strict senior Java interviewer.

The algorithm implemented here is: ${algorithmName}

-----------------------------------------
Official Reference Implementation:

${currentTemplateCode}

-----------------------------------------
Student Implementation:

${userCode}

-----------------------------------------

IMPORTANT RULE:
If both solutions are logically equivalent but implemented differently,
do NOT mark as wrong. Instead evaluate efficiency and clarity.

-----------------------------------------

1. Compare both implementations.
2. Identify logical mistakes.
3. Identify missing edge cases.
4. Analyze time and space complexity.
5. Suggest improvements.
6. Provide corrected version if needed.
7. Give score out of 10 using strict rubric.

Be strict but constructive.
`;

      navigator.clipboard.writeText(prompt);
      alert("AI Review Prompt copied to clipboard ✅");
    }
  </script>

</body>
</html>
